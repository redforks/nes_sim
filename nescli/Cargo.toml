[package]
name = "nescli"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
hotpath = ["hotpath/hotpath", "nes_core/hotpath", "nes_sdl/hotpath"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "nes_core/hotpath-alloc",
    "nes_sdl/hotpath-alloc",
]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
env_logger.workspace =true
log.workspace =true
image = { workspace = true, features = ["png"] }
nes_core = { workspace = true }
nes_sdl = { path = "../nes_sdl" }
hotpath = "0.30"
