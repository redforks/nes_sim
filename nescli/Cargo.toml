[package]
name = "nescli"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
hotpath = ["hotpath/hotpath", "nes_core/hotpath", "nes_sdl/hotpath"]
# Sampling-based CPU profiling (samply): per-function CPU sample attribution.
# Needs samply + hotpath-samply in PATH and kernel perf permissions; see
# `just profile-cpu`.
hotpath-cpu = ["hotpath/hotpath-cpu", "nes_core/hotpath-cpu", "nes_sdl/hotpath-cpu"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
env_logger.workspace =true
log.workspace =true
image = { workspace = true, features = ["png"] }
nes_core = { workspace = true }
nes_sdl = { path = "../nes_sdl" }
hotpath = "0.30"
